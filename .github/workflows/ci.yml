name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    name: Front React/TS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: d
        run: test -f frontend/package-lock.json && echo "ok=true" >> "$GITHUB_OUTPUT" || echo "Front ainda não existe, pulando"
      - if: steps.d.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: steps.d.outputs.ok == 'true'
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit
          npm run lint --if-present
          npm test --if-present -- --coverage
          npm run build
