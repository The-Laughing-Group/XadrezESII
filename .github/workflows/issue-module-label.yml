name: Issue module label
on:
  issues:
    types: [opened, edited]
permissions:
  issues: write
jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';
            const m = body.match(/### Módulo\s+([^\n]+)/);
            if (!m) return;
            const map = { 'Regras': 'mod:regras', 'IA': 'mod:ia', 'Frontend': 'mod:frontend', 'Infra': 'mod:infra' };
            const label = map[m[1].trim()];
            if (!label) return;
            await github.rest.issues.addLabels({
              ...context.repo,
              issue_number: context.issue.number,
              labels: [label],
            });